networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: ${LAN_INTERFACE:-eth0}
    ipam:
      config:
        - subnet: ${LAN_SUBNET:-192.168.1.0/24}
          gateway: ${LAN_GATEWAY:-192.168.1.1}
  internal:
    driver: bridge

services:
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      # These cameras stall for a few seconds at a time. The 10s default tore
      # the published path down (and killed ffmpeg with it) on stalls the p2p
      # proxy would have ridden out on its own, turning a brief freeze into a
      # full reconnect. Keep this at/below the proxy's deadmanTimeout so the
      # proxy is what decides a session is dead.
      - MTX_READTIMEOUT=25s
    networks:
      lan:
        ipv4_address: ${MEDIAMTX_IP}
      internal:

  wyze-api:
    build: ./wyze-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    labels:
      - autoheal=true
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      - MEDIAMTX_HOST=${MEDIAMTX_IP}
      - LAN_SUBNET=${LAN_SUBNET:-192.168.0.0/24}
      - LAN_SCAN_INTERFACE=${LAN_INTERFACE:-eth0}
    networks:
      lan:
        ipv4_address: ${API_IP}
      internal:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  wyze-p2p:
    build: ./wyze-p2p
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      wyze-api:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    working_dir: /app
    networks:
      lan:
        ipv4_address: ${P2P_IP}
      internal:
    environment:
      - CRYZE_API_URL=http://wyze-api:8080
      - MEDIAMTX_HOST=${MEDIAMTX_IP}
      - MEDIAMTX_PORT=8554

  monitor:
    image: docker:cli
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/monitor/collect.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitor:/monitor
    networks:
      - internal

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=30
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
